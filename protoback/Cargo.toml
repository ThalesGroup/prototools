[package]
name        = "protoback"
version.workspace    = true
edition     = "2021"
description = "Give back the .proto sources a protobuf descriptor set was compiled from"
license     = "MIT"
repository.workspace = true
# Not published yet: reproto and protoback run side by side (spec 0424 S15).
publish     = false

[[bin]]
name = "protoback"
path = "src/main.rs"

[dependencies]
prototext-upb  = { workspace = true }
prototext-core = { workspace = true }
fdp-scan       = { workspace = true }
clap           = { version = "4.5", features = ["derive", "env"] }
serde          = { version = "1", features = ["derive"] }
serde_yaml     = "0.9"
sha2           = "0.10"
regex          = "1"
workspace-hack = { version = "0.1", path = "../workspace-hack" }
rapidfuzz = "0.5"
rayon = "1"
rustc-hash = "2"
foldhash = { version = "0.2", optional = true }
tikv-jemallocator = "0.7"
prototools-affinity = { workspace = true }
prototext-graph = { workspace = true }
prototools-complete = { workspace = true }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
clap_mangen = "0.2"
indicatif = "0.17"

# The hasher of protoback's maps (src/hash.rs, spec 0442 S4): rustc-hash's
# unless one of these is enabled. Not a default feature: the workspace's
# Nix builds pass --no-default-features.
[features]
hash-fold = ["dep:foldhash"]
hash-sip = []
# The global allocator (src/alloc.rs, spec 0443 P3): jemalloc, unless
# this selects the system's.
alloc-system = []
# The sysfs tree read from $PROTOTOOLS_AFFINITY_SYSFS: measurements only
# (spec 0444), never in a release build.
affinity-sysfs-override = ["prototools-affinity/sysfs-override"]
