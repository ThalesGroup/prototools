[package]
name        = "git-seriate-fdp"
version.workspace    = true
edition     = "2021"
description = "git-seriate for the protobuf descriptors embedded in executables"
license     = "MIT"
repository.workspace = true
readme      = "../README.md"
keywords    = ["git", "protobuf", "descriptor", "snapshots", "history"]
categories  = ["command-line-utilities", "development-tools"]

[dependencies]
clap            = { version = "4", features = ["derive"] }
fdp-scan        = { workspace = true }
git-seriate     = { workspace = true }
gix             = { version = "0.76", default-features = false, features = ["tree-editor"] }
prototext       = { workspace = true }
prototext-core  = { workspace = true }
prototext-graph = { workspace = true }
prototext-upb   = { workspace = true }
chrono          = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json      = "1"
seriation       = { workspace = true }
workspace-hack  = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
