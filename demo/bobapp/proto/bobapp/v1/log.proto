syntax = "proto3";

package bobapp.v1;

import "google/protobuf/timestamp.proto";
import "google/maps/places/v1/places_service.proto";
import "google/maps/routing/v2/routes_service.proto";

// One round trip: when it happened, which method, and the bytes in each
// direction typed against their service schema.
//
// Fields 4/5 (Places/SearchText) are in the embedded descriptor set —
// protoscan finds those types in the binary.  Fields 6/7 (Routes/
// ComputeRoutes) are NOT embedded; they appear as unknown typed fields
// under bobapp.desc and open fully under a Routes-aware descriptor set.
//
// bobapp.v1.Log and bobapp.v1.Entry are themselves not in the embedded
// set, so the log envelope is also opaque until a descriptor set that
// includes this file is provided.
message Entry {
  google.protobuf.Timestamp at = 1;

  // Last segment of the gRPC method path, e.g. "SearchText" or
  // "ComputeRoutes".
  string method = 2;

  // Places/SearchText pair — types present in the embedded descriptor set.
  google.maps.places.v1.SearchTextRequest  places_request  = 4;
  google.maps.places.v1.SearchTextResponse places_response = 5;

  // Routes/ComputeRoutes pair — types NOT in the embedded set.
  google.maps.routing.v2.ComputeRoutesRequest  routes_request  = 6;
  google.maps.routing.v2.ComputeRoutesResponse routes_response = 7;
}

message Log {
  repeated Entry entry = 1;
}
