# bobapp — a toy gRPC client that leaves bytes worth opening.
#
# Deliberately NOT a member of the root workspace (spec 0241 S1).  Cargo
# unifies features across a workspace, so making bobapp a member would drag
# tonic, hyper, rustls and tokio into every `--workspace` derivation and into
# `depsCache`.  None of those four appear in the workspace graph today.
#
# One crate, two shipped builds: which one you get is decided entirely by the
# descriptor set nix hands build.rs.  See nix/python.nix for the difference.
#
#   BOBAPP_DESCRIPTOR_SET=$(nix-build -A bobapp2-desc --no-out-link)/bobapp2.desc \
#     cargo build --release --manifest-path demo/bobapp/Cargo.toml
#
# The tests additionally need BOBAPP_TRACE_DESCRIPTOR_SET; the dev-shell
# exports both.

[package]
name        = "bobapp"
version     = "0.1.0"
edition     = "2021"
description = "Toy reflective gRPC client that logs the bytes it puts on the wire"
license     = "MIT"
publish     = false

[dependencies]
anyhow       = "1"
bytes        = "1"
clap         = { version = "4", features = ["derive"] }
prost        = "0.14"
# `serde` only so that the response can be printed as JSON; the request is
# still built field by field against the descriptors.
prost-reflect = { version = "0.16", features = ["serde"] }
# The wire rewriter goes through text and back (see `src/anomaly.rs`).  The
# dependency runs bobapp -> prototext-core and never the other way, so the
# workspace graph is untouched.
prototext-core = { path = "../../prototext-core" }
serde        = "1"
serde_json   = "1"
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }
tonic        = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
    "tls-ring",
    "tls-native-roots",
] }

[profile.release]
codegen-units   = 1
lto             = "thin"
overflow-checks = true
