name: Nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    if: github.repository == 'douzebis/prototools'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ci-target: ci
          - os: ubuntu-24.04-arm
            ci-target: ci
          - os: macos-15
            ci-target: ci
          # macos-15-intel disabled: the Determinate Nix Installer no
          # longer supports macOS on Intel (see
          # https://github.com/DeterminateSystems/nix-src/issues/224).
          # Re-enable once there's a working installer path for Intel
          # Macs, or drop this target for good.
          # - os: macos-15-intel
          #   ci-target: ci-no-clippy
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: "disabled"

      # Spec 0402 S1: no import-from-derivation, which nixpkgs forbids and
      # which would stall evaluation on a build. Seconds, so it goes first.
      - name: Evaluate without import-from-derivation
        run: nix-instantiate -A ${{ matrix.ci-target }} --option allow-import-from-derivation false > /dev/null

      - name: Check formatting (rustfmt)
        run: nix-build -A rust-fmt

      # One build for the rest, clippy included (ci-no-clippy where it is
      # known to fail), so Nix runs clippy and the tests side by side rather
      # than one step after the other (spec 0401 S9). rustfmt stays first:
      # it fails fast and needs nothing compiled.
      - name: Run CI targets (clippy, tests, build, reproto tests, python lint)
        run: nix-build -A ${{ matrix.ci-target }}

      # Spec 0412 S4: the packages a release publishes, built on main as
      # checks. A release tag builds and publishes them in publish.yaml.
      - name: Build PyPI wheels
        if: github.ref == 'refs/heads/main'
        run: nix-build -A pypi

      - name: Build crates-io packages
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: nix-build -A crates-io
