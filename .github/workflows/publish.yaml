# Publish a release: seven crates to crates.io, five Python packages to PyPI
# (spec 0412).
#
# A pushed tag v* starts it, in douzebis/prototools only (the ThalesGroup
# mirror receives the same tags). `check-version` checks the tag against the
# workspace version. `crates` packages and verifies the crates (artifact
# `crates`); `wheels` builds the wheels on the three runners (artifacts
# `wheels-*`). Inspect the artifacts, then approve the uploads: each publish
# job runs in an environment (`crates-io`, `pypi`) that requires the
# maintainer's approval and only accepts v* tags (repository settings).
# Both authenticate with trusted publishing: no stored secret.
#
# The uploads are resumable: a crate already published at this version is
# skipped, and so is a file already on PyPI, so if one fails halfway,
# re-running its job finishes the release.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    if: github.repository == 'douzebis/prototools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          case "$version" in
            *-dev)
              echo "::error::Cargo.toml has development version $version"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::ref $GITHUB_REF_NAME does not match version $version (Cargo.toml)"
            exit 1
          fi

  crates:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Package and verify the crates
        run: nix-shell default.nix -A release-shell --run scripts/check-crates

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates
          path: target/package/*.crate

  wheels:
    name: Build wheels — ${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Reuses what the push to main already built from the same commit.
      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-flakehub: "disabled"

      - name: Build the wheels
        run: nix-build -A pypi -o wheels

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheels/*.whl

  publish-crates:
    name: Publish to crates.io
    needs: crates
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `crates` already built and verified the packages from the same
      # tagged source and lock file, so the upload does not build them again.
      - name: Publish the crates, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: nix-shell default.nix -A release-shell --run scripts/publish-crates

  # Waits for `crates` too: a release whose crates fail their checks is not
  # published anywhere.
  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, crates]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prototext-reproto/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Files already on PyPI are skipped, so a re-run finishes a
          # half-done upload.
          skip-existing: true
