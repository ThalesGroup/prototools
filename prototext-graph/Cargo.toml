[package]
name        = "prototext-graph"
version.workspace    = true
edition     = "2021"
description = "Build a Hopcroft-deduplicated scoring graph from protoback's YAML output"
license     = "MIT"
repository.workspace = true

[lib]
name       = "prototext_graph"
crate-type = ["rlib"]

[[bin]]
name = "hopcroft_dump"
path = "src/bin/hopcroft_dump.rs"

[[test]]
name = "hopcroft_suite"
path = "tests/hopcroft_suite.rs"

[dependencies]
serde          = { version = "1", features = ["derive"] }
serde_yaml     = "0.9"
rkyv           = { version = "0.8", features = ["little_endian"] }
memmap2        = "0.9"
prototext-core = { workspace = true }
smallvec       = "1"
walkdir        = "2"
rustc-hash     = "2"
rayon          = "1"
foldhash       = { version = "0.2", optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# The hasher of the internal maps (src/hash.rs, spec 0443 P7):
# rustc-hash's unless one of these is enabled.
[features]
hash-fold = ["dep:foldhash"]
hash-sip = []

[dev-dependencies]
tempfile    = "3"
criterion   = "0.5"

[[bench]]
name    = "score"
harness = false
