# prototools workspace
#
# A collection of protobuf utilities.
# Each tool is an independent crate with its own version on crates.io.
#
# Current members:
#   prototext-core   — pure-Rust library (codec + schema)
#   prototext        — binary: enhanced-textproto ↔ wire converter
#
# Future members slot in as siblings without restructuring:
#   reproto/         → crates.io: reproto

[workspace]
resolver = "2"
members = [
    "prototext-core",
    "prototext",
    "prototext-pyo3",
    "fdp-scan-pyo3",
    "prototext-graph",
    "prototext-graph-pyo3",
    "prototext-schema",
    "protolens",
    "workspace-hack",
]

# demo/bobapp is its own Cargo project with its own lockfile (spec 0241 S1).
# Cargo unifies features across a workspace, so as a member it would pull
# tonic, hyper, rustls and tokio into every `--workspace` derivation and into
# `depsCache` — none of the four are in the graph today.  `workspaceSrc` in
# default.nix subtracts the directory as well, because crane's
# `commonCargoSources` admits any .rs/.toml it finds regardless of this list.
exclude = [
    "demo/bobapp",
]

[workspace.dependencies]
prototext-core   = { path = "prototext-core", version = "0.3.0", features = ["prost-bug-workaround"] }
prototext-schema = { path = "prototext-schema", version = "0.1.0" }

[profile.release]
codegen-units   = 1
lto             = "thin"
overflow-checks = true

# Release codegen plus line tables, for `bin/profile`.  A profile of the hot
# walks stops at the function boundary without them, and `score_message_multi`
# alone is 43% of a protolens startup — see docs/prototext/walk-profiles.md.
# Separate from `release` so a profiling build never invalidates target/release
# and cannot be shipped by accident; `line-tables-only` because callgrind and
# perf need line numbers, not variable locations, and full debug info costs
# link time and disk for nothing here.
[profile.profiling]
inherits = "release"
debug    = "line-tables-only"
