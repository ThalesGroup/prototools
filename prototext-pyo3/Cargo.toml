[package]
name    = "prototext_codec_lib"
version.workspace    = true
edition = "2021"

# An rlib only: maturin adds the cdylib itself when it builds the wheel
# (spec 0477 S1). Then the stub generator, which links the rlib, and
# maturin compile the dependencies alike under the release profile's thin
# LTO, and maturin compiles none of them again. `cargo build` writes no
# module; `cargo rustc --lib --crate-type cdylib` does.
[lib]
name       = "prototext_codec_lib"
crate-type = ["rlib"]

[dependencies]
prototext-core       = { workspace = true }
prototext-upb        = { workspace = true }
pyo3                 = { version = "0.29", features = ["extension-module"] }
pyo3_stub_gen        = { version = "0.23", package = "pyo3-stub-gen" }
pyo3_stub_gen_derive = { version = "0.23", package = "pyo3-stub-gen-derive" }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[[bin]]
name = "prototext_post_build"
path = "src/bin/post_build.rs"

[build-dependencies]
pyo3-build-config = "0.29"
