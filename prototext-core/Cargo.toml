[package]
name        = "prototext-core"
version.workspace    = true
edition     = "2021"
description = "Pure-Rust library for lossless protobuf ↔ enhanced-textproto conversion"
license     = "MIT"
repository.workspace = true
readme      = "../README.md"
keywords    = ["protobuf", "proto", "textproto", "serialization"]
categories  = ["encoding", "parser-implementations"]

[lib]
name       = "prototext_core"
crate-type = ["rlib"]

[dependencies]
# Schemas are read through upb, Google's C protobuf runtime (spec 0415).
prototext-upb = { workspace = true }
memchr        = "2"
smallvec      = "1"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
criterion   = "0.5"

[[bench]]
name    = "codec"
harness = false
