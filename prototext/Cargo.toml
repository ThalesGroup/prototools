[package]
name        = "prototext"
version.workspace    = true
edition     = "2021"
description = "Lossless protobuf ↔ enhanced-textproto converter"
license     = "MIT"
repository.workspace = true
readme      = "../README.md"
keywords    = ["protobuf", "proto", "textproto", "cli"]
categories  = ["command-line-utilities", "encoding"]
include     = [
  "src/**",
  "tests/**",
  "fixtures/schemas/**",
  "fixtures/prebuilt/descriptor.pb",
  "fixtures/prebuilt/knife.pb",
  "fixtures/prebuilt/enum_collision.pb",
  "fixtures/prebuilt/message_set.pb",
  "wkt/**",
  "build.rs",
  "Cargo.toml",
]

[package.metadata.docs.rs]
targets = []

[[bin]]
name = "prototext"
path = "src/main.rs"

[dependencies]
prototext-core  = { workspace = true }
prototext-graph = { workspace = true }
prototext-schema = { workspace = true }
memmap2         = "0.9"
rkyv            = { version = "0.8", features = ["little_endian"] }
clap            = { version = "4.5", features = ["derive"] }
clap_complete   = { version = "4.5", features = ["unstable-dynamic"] }
prototools-complete = { workspace = true }
clap_mangen     = "0.2"
globset         = "0.4"
serde           = { version = "1", features = ["derive"] }
serde_yaml      = "0.9"
strsim          = "0.11"
walkdir         = "2"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
default      = ["wkt-db"]
wkt-db       = []

[[test]]
name    = "protocraft"
path    = "tests/protocraft.rs"
harness = false

[dev-dependencies]
toml        = "0.8"
