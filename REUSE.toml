version = 1
SPDX-PackageName = "prototools"
SPDX-PackageSupplier = "Frederic Ruget <fred@atlant.is>"
SPDX-PackageDownloadLocation = "https://github.com/douzebis/prototools"

# nixpkgs staging: files submitted to nixpkgs verbatim, which carry no SPDX
# header there (spec 0405 S6).
[[annotations]]
path = [
  "nixpkgs/**",
]
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Files generated or managed by cargo-hakari (workspace-hack crate).
[[annotations]]
path = [
  ".config/hakari.toml",
  "workspace-hack/",
  "workspace-hack/**",
]
SPDX-FileCopyrightText = "cargo-hakari contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Vendored, locally-modified copy of upstream tree-sitter-textproto's
# grammar.js (pinned commit 568471b80fd8793d37ed01865d8c2208a9fefd1b) — see
# docs/specs/0121-tree-sitter-textproto-field-no-vendoring.md.
[[annotations]]
path = [
  "reproto/tree-sitter-textproto/grammar.js",
]
SPDX-FileCopyrightText = "Porter Matteo Haet"
SPDX-License-Identifier = "ISC"

# Generated by `tree-sitter generate` from that grammar.js and committed
# (spec 0408 S1), so licensed like it. default.nix's
# tree-sitter-textproto-check keeps them in step with the grammar.
[[annotations]]
path = [
  "reproto/tree-sitter-textproto/src/**",
]
SPDX-FileCopyrightText = "Porter Matteo Haet"
SPDX-License-Identifier = "ISC"


# Empty placeholders that keep the GreHack 2026 demo's per-character working
# directories in git (spec 0388 S2).
[[annotations]]
path = [
  "grehack2026/eve/.gitkeep",
  "grehack2026/bob/.gitkeep",
]
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"
