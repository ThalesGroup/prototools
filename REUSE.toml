version = 1
SPDX-PackageName = "prototools"
SPDX-PackageSupplier = "Frederic Ruget <fred@atlant.is>"
SPDX-PackageDownloadLocation = "https://github.com/douzebis/prototools"

# nixpkgs staging: files submitted to nixpkgs verbatim, which carry no SPDX
# header there (spec 0405 S6).
[[annotations]]
path = [
  "nixpkgs/**",
]
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# Files generated or managed by cargo-hakari (workspace-hack crate).
[[annotations]]
path = [
  ".config/hakari.toml",
  "workspace-hack/",
  "workspace-hack/**",
]
SPDX-FileCopyrightText = "cargo-hakari contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# upb, Google's C protobuf runtime, vendored from protobuf v36.2
# (prototext-upb/vendor/VERSION; spec 0415 S1), unmodified but for the
# upstream fixes in vendor/patches, with that release's descriptor.proto
# and protoc's compilation of it (spec 0424 S6).
[[annotations]]
path = [
  "prototext-upb/vendor/LICENSE",
  "prototext-upb/vendor/upb/**",
  "prototext-upb/vendor/patches/**",
  "prototext-upb/vendor/descriptor.proto",
  "prototext-upb/vendor/descriptor.pb",
]
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "BSD-3-Clause"

# utf8_range, which upb depends on, vendored with it.
[[annotations]]
path = [
  "prototext-upb/vendor/utf8_range/**",
]
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "MIT"

# Vendored, locally-modified copy of upstream tree-sitter-textproto's
# grammar.js (pinned commit 568471b80fd8793d37ed01865d8c2208a9fefd1b) — see
# docs/specs/0121-tree-sitter-textproto-field-no-vendoring.md.
[[annotations]]
path = [
  "reproto/tree-sitter-textproto/grammar.js",
]
SPDX-FileCopyrightText = "Porter Matteo Haet"
SPDX-License-Identifier = "ISC"

# Generated by `tree-sitter generate` from that grammar.js and committed
# (spec 0408 S1), so licensed like it. default.nix's
# tree-sitter-textproto-check keeps them in step with the grammar.
[[annotations]]
path = [
  "reproto/tree-sitter-textproto/src/**",
]
SPDX-FileCopyrightText = "Porter Matteo Haet"
SPDX-License-Identifier = "ISC"

# The well-known types' descriptors reproto ships, compiled from protobuf's
# own .proto files (Copyright 2008 Google Inc., BSD-3-Clause), so licensed
# like them (spec 0409 S4). default.nix's reproto-wkt-check keeps them in
# step with the pinned protobuf.
[[annotations]]
path = [
  "reproto/src/reproto/variants/google-protobuf/google/protobuf/*.pb",
]
SPDX-FileCopyrightText = "2008 Google Inc."
SPDX-License-Identifier = "BSD-3-Clause"


# fdp-scan's regression corpus (spec 0448 S8), generated by
# fdp-scan/tests/corpus/generate.py, contributed by a downstream user: the
# well-known types' serialized descriptors, from Python's protobuf (Copyright
# 2008 Google Inc., BSD-3-Clause), as they are and mutated, laid out with
# hand-built and random neighbors; and the truth files naming where each
# record lies.
[[annotations]]
path = [
  "fdp-scan/tests/corpus/*.bin",
  "fdp-scan/tests/corpus/*.json",
]
SPDX-FileCopyrightText = [
  "2008 Google Inc.",
  "2026 THALES CLOUD SECURISE SAS",
]
SPDX-License-Identifier = "MIT AND BSD-3-Clause"

# Empty placeholders that keep the GreHack 2026 demo's per-character working
# directories in git (spec 0388 S2).
[[annotations]]
path = [
  "grehack2026/eve/.gitkeep",
  "grehack2026/bob/.gitkeep",
]
SPDX-FileCopyrightText = "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)"
SPDX-License-Identifier = "MIT"

# reproto's zsh and fish completion scripts, derived from Click 8.3's own
# (click/shell_completion.py) with reproto's candidate types added (spec
# 0422). zsh reads `#compdef` on a script's first line, so the notice is
# kept here rather than in a header.
[[annotations]]
path = [
  "reproto/src/reproto/completions.zsh",
  "reproto/src/reproto/completions.fish",
]
SPDX-FileCopyrightText = [
  "2014 Pallets",
  "Frederic Ruget <fred@atlant.is> (GitHub: @douzebis)",
]
SPDX-License-Identifier = "MIT AND BSD-3-Clause"

# pyvis 0.3.2's page, as reproto's --scoring-html-out writes it, embedded
# by protoback to write the same bytes (spec 0430 S8): its template
# rendered for reproto's settings, with markers where the data and the
# assets go, and its bindings script, unchanged.
[[annotations]]
path = [
  "protoback/src/scoring/html/page-small.html",
  "protoback/src/scoring/html/page-large.html",
  "protoback/src/scoring/html/utils.js",
]
SPDX-FileCopyrightText = "2018, West Health Institute"
SPDX-License-Identifier = "BSD-3-Clause"

# vis-network 9.1.2, as pyvis 0.3.2 ships it, unchanged (spec 0430 S8).
[[annotations]]
path = [
  "protoback/src/scoring/html/vis-network.css",
  "protoback/src/scoring/html/vis-network.min.js",
]
SPDX-FileCopyrightText = [
  "2011-2017 Almende B.V, http://almende.com",
  "2017-2019 visjs contributors, https://github.com/visjs",
]
SPDX-License-Identifier = "Apache-2.0 OR MIT"
