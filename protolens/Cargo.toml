[package]
name        = "protolens"
version     = "0.1.0"
edition     = "2021"
description = "Interactive TUI to decode, navigate, and extract raw bytes from a binary protobuf"
license     = "MIT"
repository  = "https://github.com/ThalesGroup/prototools"

[[bin]]
name = "protolens"
path = "src/main.rs"

[dependencies]
prototext-core        = { workspace = true }
prototext-graph       = { path = "../prototext-graph", version = "0.2.1" }
prototext-schema      = { workspace = true }
prost-reflect         = "0.16"
clap                  = { version = "4.5", features = ["derive", "env"] }
clap_complete         = { version = "4.5", features = ["unstable-dynamic"] }
clap_mangen           = "0.2"
memchr                = "2"
ratatui               = "0.30"
# Spec 0273 S16: the search pattern is an RE2 regex. Already in the
# lockfile via tree-sitter and tree-sitter-highlight, so this costs no
# new compilation.
regex                 = "1.12"
# Spec 0274 S17: the multi-line engine, which searches through a chunked
# `Cursor` rather than a contiguous haystack. `default-features = false`
# drops its `ropey` adapter, which is for a rope we do not have.
regex-cursor          = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
regex-syntax          = "0.8"
crossterm             = "0.29"
serde                 = { version = "1.0", features = ["derive"] }
serde_norway          = "0.9"
sha2                  = "0.10"
tree-sitter           = "0.26.11"
tree-sitter-highlight = "0.26.11"
terminal-light        = "1.9.0"
terminfo              = "0.9.0"
workspace-hack        = { version = "0.1", path = "../workspace-hack" }
xterm-query           = "0.6.0"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# "sched" is spec 0264's sched_get/setaffinity; the rest predate it.
nix  = { version = "0.29", features = ["poll", "process", "sched", "signal", "term"] }
# Spec 0263 S10: the input reader registers its own SIGWINCH pipe so it
# can block in an untimed poll(2). Already in the lockfile via crossterm,
# which uses it for the same purpose.
signal-hook = "0.3"

[dev-dependencies]
prost       = "0.14"
prost-types = "0.14"
