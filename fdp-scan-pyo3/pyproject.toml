# pyproject.toml for the fdp_scan Python extension, built by maturin.

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fdp-scan"
version = "0.3.6"
description = "Rust Python extension for scanning binaries for embedded FileDescriptorProto blobs"
requires-python = ">=3.8"

[tool.pyo3-stub-gen]
# The generator writes into target/stubs/fdp-scan-pyo3/ (stub_info() in
# src/lib.rs), never over the committed stub: the Nix build compares the
# two (spec 0409 S2).

[tool.maturin]
# Mixed layout: the compiled module sits inside the Python package that
# re-exports it, next to its committed stub.
module-name = "fdp_scan_lib.fdp_scan_lib"
python-source = "."
exclude = ["**/*.license"]
