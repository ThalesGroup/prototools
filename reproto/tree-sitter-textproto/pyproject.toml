[build-system]
requires      = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name            = "tree-sitter-textproto"
version         = "0.3.3.dev0"
description     = "The textproto tree-sitter grammar, for the Python tree_sitter library"
requires-python = ">=3.8"
# The parser is generated from Porter Matteo Haet's ISC grammar; the
# binding is ours, MIT. LICENSE holds both notices, which ISC requires
# every copy to carry (spec 0411 S2).
license         = "ISC AND MIT"
license-files   = ["LICENSE"]

[tool.setuptools]
packages = ["tree_sitter_textproto"]

[tool.setuptools.package-data]
tree_sitter_textproto = ["*.pyi", "py.typed"]
