[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prototext-reproto"
version = "0.3.1.dev0"
description = "Reconstruct .proto source files from compiled .pb descriptor sets"
authors = [{ name = "Frederic Ruget", email = "fred@atlant.is" }]
# What reproto imports, and nothing else (spec 0411 S3). The four from
# this repository are released together, at the workspace's version:
# nix/rust.nix fails evaluation when a lower bound falls behind it.
dependencies = [
    "click",
    "google-re2",
    "protobuf",
    "pyvis",
    "pyyaml",
    "rapidfuzz",
    "rich",
    # 0.22 takes a grammar as a capsule, as tree-sitter-textproto gives it.
    "tree-sitter>=0.22",
    "fdp-scan>=0.3.1.dev0",
    "prototext-codec>=0.3.1.dev0",
    "prototext-graph>=0.3.1.dev0",
    "tree-sitter-textproto>=0.3.1.dev0",
]

[project.scripts]
reproto = "reproto.cli:main"
reproto-gen-man = "reproto.gen_man:main"
reproto-instantiate-schema-gen-man = "reproto.gen_man_instantiate:main"
reproto-instantiate-schema = "reproto.instantiate_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reproto.variants" = ["*.yaml", "**/*.pb"]

[tool.pytest.ini_options]
testpaths = ["src/reproto/tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-n auto"

[tool.ruff]
src = ["src"]
fix = true
